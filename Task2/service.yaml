apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          resources:
            requests:
              memory: "30Mi"
            limits:
              memory: "30Mi"
          ports:
            - containerPort: 8080 
---
apiVersion: v1
kind: Service
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  selector:
    app: scaletestapp
  type: NodePort
  ports:
    - name: scaletestapp-port
      protocol: TCP
      port: 8080
      targetPort: 8080