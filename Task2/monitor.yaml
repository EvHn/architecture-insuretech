apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scaletestapp-sm
  namespace: default
  labels:
    release: prometheus-operator
spec:
  endpoints:
    - port: scaletestapp-port
      path: /metrics
      interval: 10s
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: scaletestapp
 