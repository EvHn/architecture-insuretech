# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mkdir
        run: mkdir ./build

      - name: As is schema to png
        uses: Burnett01/actions-drawio@1.2
        with:
          src: ./Task1/InsureTech_технологическая_архитектура-as-is.drawio.xml
          dest: ./build/task-1-InsureTech_технологическая_архитектура-as-is.drawio.png

      - name: To be schema to png
        uses: Burnett01/actions-drawio@1.2
        with:
          src: ./Task1/InsureTech_технологическая_архитектура-to-be.drawio.xml
          dest: ./build/task-1-InsureTech_технологическая_архитектура-to-be.drawio.png

      - name: Upload image as artifact
        uses: actions/upload-artifact@v6
        with:
          name: schemas
          path: ./build/