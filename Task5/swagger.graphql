type Query {
  client(id: ID!): Client
}

type Client {
  id: ID!
  name: String
  age: Int
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}

query GetDocuments($clientId: ID!) {
  client(id: $clientId) {
    documents {
       id
       type
       number
       issueDate
       expiryDate
    }
  }
}

query GetClient($id: ID!) {
  client(id: $id) {
    name
    age
  }
}

query GetRelatives($clientId: ID!) {
  client(id: $clientId) {
    relatives {
      id
      relationType
      name
      age
    }
  }
}